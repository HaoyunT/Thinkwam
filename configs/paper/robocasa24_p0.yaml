# ThinkWAM RoboCasa24 P0 (paper Appendix: Optimization and Training Algorithm).
# DeVA protocol: 1,199 replay-filtered demonstrations, episode-level split into
# 1,080 training / 119 validation episodes (seed 7). 20k steps, LR 1e-4 -> 1e-5
# with linear warmup + cosine decay, global batch 96 (24 per GPU x 4 A100).
# Loss = 1.0 * FM + 0.5 * JEPA. configs/paper/robocasa24_p1.yaml warm-starts
# from the final 20k checkpoint of this run.
dataset: robocasa24
dataset_root: /data/thinkwam/robocasa24_deva
feature_cache: ""
output_dir: /data/thinkwam/runs/paper/robocasa24_p0_20k

online_vjepa: true
image_augmentations: false
visual_token_count: 1728
qwen_visual_tokens: 1152
qwen_hidden_only: true
text_max_length: 128
vjepa_views: 3

qwen_lora: true
qwen_lora_rank: 32
qwen_lora_alpha: 64
qwen_lora_dropout: 0.1
qwen_lora_target_modules: all-linear
qwen_attn_implementation: flash_attention_2

compile_vjepa: true
vjepa_compile_mode: reduce-overhead
compile_action_dit: true
action_dit_compile_mode: reduce-overhead

action_dim: 7
# The RoboCasa24 adapter supplies a zero proprioception placeholder channel.
proprio_dim: 1
action_horizon: 16
action_dit_hidden: 1024
action_dit_layers: 16
action_dit_heads: 32
action_dit_inner_dim: 1536
action_dit_future_tokens: 32
flow_steps: 4
memory_action_history: 8
memory_observation_tokens: 256

jepa_horizons: [7, 15, 31]
jepa_token_counts: [288, 144, 72]
jepa_observation_tokens: 1152
memory_dim: 1024
memory_slots: 16
jepa_context_dim: 1024
jepa_loss_weight: 0.5
action_loss_weight: 1.0
sigreg_loss_weight: 0.0
action_context_dim: 1024
conditioning_mlp_hidden: 2048

batch_size: 24
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
min_learning_rate: 1.0e-5
weight_decay: 0.0
warmup_ratio: 0.03
num_workers: 8
dataloader_prefetch_factor: 2
dataloader_persistent_workers: true
dataloader_pin_memory: true
dataloader_worker_threads: 1
mixed_precision: bf16
gradient_checkpointing: false
checkpoint_save_limit: 3
optimizer_beta1: 0.9
optimizer_beta2: 0.95

max_steps: 20000
eval_every: 5000
eval_batches: 32
eval_fraction: 0.1
tensorboard: true
open_loop_eval: true
save_best_checkpoint: true
seed: 7
