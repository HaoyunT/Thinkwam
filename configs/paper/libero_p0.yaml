# ThinkWAM LIBERO P0 (paper Appendix: Optimization and Training Algorithm).
# 40k steps, LR 1e-4 -> 1e-5 with linear warmup + cosine decay, global batch
# 96 (24 per GPU x 4 A100). Loss = 1.0 * FM + 0.5 * JEPA. P1 warm-starts from
# the final 40k checkpoint of this run (configs/paper/libero_p1.yaml).
dataset: libero
dataset_root: /data/thinkwam/datasets/LIBERO
feature_cache: ""
output_dir: /data/thinkwam/runs/paper/libero_p0_40k

online_vjepa: true
image_augmentations: true
image_augmentation_probability: 0.5
visual_token_count: 1152
qwen_visual_tokens: 1152
qwen_hidden_only: true
text_max_length: 128

qwen_lora: true
qwen_lora_rank: 32
qwen_lora_alpha: 64
qwen_lora_dropout: 0.1
qwen_lora_target_modules: all-linear
qwen_attn_implementation: flash_attention_2

compile_vjepa: true
vjepa_compile_mode: reduce-overhead
compile_action_dit: true
action_dit_compile_mode: reduce-overhead

vjepa_views: 2
action_dim: 7
proprio_dim: 8
action_horizon: 16
flow_steps: 4
action_dit_hidden: 1024
memory_action_history: 8
memory_observation_tokens: 256
jepa_horizons: [7, 15, 31]
jepa_token_counts: [288, 144, 72]
jepa_observation_tokens: 1152
memory_dim: 1024
memory_slots: 16
jepa_context_dim: 1024
jepa_loss_weight: 0.5
action_loss_weight: 1.0
sigreg_loss_weight: 0.0
sigreg_num_projections: 128
sigreg_num_knots: 17
sigreg_t_max: 3.0
action_context_dim: 1024
conditioning_mlp_hidden: 2048
action_dit_layers: 16
action_dit_heads: 32
action_dit_inner_dim: 1536
action_dit_future_tokens: 32

# Per-rank batch 24; four torchrun ranks give global batch 96.
batch_size: 24
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
min_learning_rate: 1.0e-5
weight_decay: 0.0
warmup_ratio: 0.03
num_workers: 8
dataloader_prefetch_factor: 4
dataloader_persistent_workers: true
dataloader_pin_memory: true
dataloader_worker_threads: 1
mixed_precision: bf16
gradient_checkpointing: false
checkpoint_save_limit: 3
optimizer_beta1: 0.9
optimizer_beta2: 0.95

max_steps: 40000
eval_every: 5000
eval_batches: 32
eval_fraction: 0.1
tensorboard: true
tensorboard_histogram_every: 100
open_loop_eval: true
save_best_checkpoint: true
# P0 saves checkpoints and open-loop metrics. Closed-loop benchmark
# evaluation is launched separately for the final P1 checkpoint.
seed: 7
