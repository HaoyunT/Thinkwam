# ThinkWAM RoboTwin 2.0 (paper Table "architecture and benchmark-specific
# configuration" and Appendix "Optimization and Training Algorithm").
# One stage without a P0 warm start: 90k steps, LR 5e-5 -> 5e-6 with warmup +
# cosine decay (one schedule for every trainable module), global batch 80
# (20 per GPU x 4 A100), no gradient accumulation. All configured trainable
# modules optimize from the start; the visual encoder remains frozen. Training
# uses 50 tasks x 50 Clean demonstrations (2,500), a seed-7 90/10 window split,
# equal probability for each training task, and uniform windows within a task.
# Original task instructions are used, with no image augmentation or affordance guidance.
dataset: robotwin2.0
dataset_root: /data/thinkwam/datasets/robotwin2.0-lerobot-v3.0/clean
feature_cache: ""
output_dir: /data/thinkwam/runs/paper/robotwin2_clean_90k
robotwin_frame_cache: /data/thinkwam/datasets/thinkwam/robotwin2_clean_rgb384
robotwin_manifest: manifest_3view.json
# 14D actions and states are standardized with the dataset statistics.
robotwin_stats_path: /data/thinkwam/datasets/robotwin2.0-lerobot-v3.0/clean/dataset_stats.json

vjepa_checkpoint: /data/thinkwam/models/vjepa2/vjepa2_1_vitl_dist_vitG_384.pt
vjepa_dim: 1024
vjepa_image_size: 384
vjepa_patch_size: 16
# Camera order: high, left wrist, right wrist.
vjepa_views: 3
online_vjepa: true
vjepa_adapter_enabled: true
vjepa_adapter_dim: 256
visual_token_count: 1152
qwen_path: /data/thinkwam/models/Qwen2.5-0.5B
qwen_dim: 896
qwen_max_length: 512
qwen_action_tokens: 64
qwen_visual_tokens: 1152
qwen_hidden_only: true
text_max_length: 128
qwen_lora: true
qwen_lora_rank: 32
qwen_lora_alpha: 64
qwen_lora_dropout: 0.1
qwen_lora_target_modules: all-linear
qwen_attn_implementation: flash_attention_2
compile_vjepa: true
vjepa_compile_mode: default
compile_action_dit: true
action_dit_compile_mode: reduce-overhead

action_dim: 14
proprio_dim: 14
action_horizon: 32
action_dit_hidden: 1024
action_dit_layers: 16
action_dit_heads: 32
action_dit_inner_dim: 1536
action_dit_future_tokens: 32
flow_steps: 4
memory_action_history: 16
memory_observation_tokens: 256
jepa_horizons: [8, 16, 32]
jepa_token_counts: [288, 144, 72]
jepa_observation_tokens: 1152
memory_dim: 1024
memory_slots: 16
memory_layers: 2
memory_heads: 8
jepa_context_dim: 1024
jepa_layers: 2
jepa_heads: 8
jepa_loss_weight: 0.5
sigreg_loss_weight: 0.0
sigreg_num_projections: 128
sigreg_num_knots: 17
sigreg_t_max: 3.0
action_context_dim: 1024
conditioning_mlp_hidden: 2048

# lambda_0 / lambda_1 = 1.2 / 1.4, lambda_jepa / lambda_res = 0.5 / 0.2.
video_model_dim: 1024
video_model_layers: 2
video_model_heads: 8
video_context_tokens: 256
video_residual_loss_weight: 0.2
first_action_loss_weight: 1.2
action_refinement_loss_weight: 1.4
action_loss_weight: 1.0
video_condition_steps: 4
video_condition_train_steps: 1
action_condition_scale: 1.0

# Affordance labels do not cover RoboTwin: lambda_aff = 0 and no memory fusion.
affordance_enabled: false
require_affordance_targets: false
affordance_loss_weight: 0.0
affordance_memory_max_scale: 0.0
affordance_upstream_max_scale: 0.0

# One stage: all configured trainable modules optimize from step 0, without P0.
p1_stage: joint
p0_checkpoint: ""
freeze_qwen_steps: 0
freeze_vjepa_steps: 0
freeze_memory_steps: 0

image_augmentations: false

batch_size: 20
gradient_accumulation_steps: 1
learning_rate: 5.0e-5
memory_learning_rate: 5.0e-5
qwen_lora_learning_rate: 5.0e-5
vjepa_adapter_learning_rate: 5.0e-5
min_learning_rate: 5.0e-6
weight_decay: 0.0
warmup_ratio: 0.03
max_steps: 90000
num_workers: 8
dataloader_prefetch_factor: 4
dataloader_persistent_workers: true
dataloader_pin_memory: true
dataloader_worker_threads: 1
mixed_precision: bf16
gradient_checkpointing: false
checkpoint_save_limit: 5
optimizer_beta1: 0.9
optimizer_beta2: 0.95
eval_every: 5000
eval_batches: 32
eval_fraction: 0.1
tensorboard: true
tensorboard_histogram_every: 100
open_loop_eval: true
save_best_checkpoint: true
seed: 7
