[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkwam-p0"
version = "0.1.0"
description = "ThinkWAM robot policy training and evaluation"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch", "torchvision", "transformers", "peft", "pyyaml", "numpy"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]

[tool.setuptools.packages.find]
include = ["thinkwam_p0*", "thinkwam_p1*"]

[tool.setuptools.package-data]
thinkwam_p1 = ["release_data/*.json"]
